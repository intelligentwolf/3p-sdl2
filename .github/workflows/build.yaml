name: Build
on:
  pull_request:
  push:
    branches: [main, actions, wolf]
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        # WolfViewer only takes SDL2 from this package on Linux (autobuild.xml has linux64 only).
        os: [ubuntu-22.04]
        addrsize: ["64"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Linux Build Dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        # libdecor-0-dev: without it SDL builds with no client-side decorations, and a native
        # Wayland window on GNOME (no xdg-decoration) has no title bar. It is loaded at run time
        # (SDL_WAYLAND_LIBDECOR_SHARED), so users without libdecor are unaffected.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libibus-1.0-dev \
            fcitx-libs-dev libudev-dev libunwind-dev \
            libwayland-dev libxkbcommon-dev libpulse-dev libsndio-dev \
            libdecor-0-dev

      - name: Build with autobuild
        uses: secondlife/action-autobuild@v5
        with:
          addrsize: ${{ matrix.addrsize }}
  release:
    needs: build
    runs-on: [ubuntu-latest]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: secondlife/action-autobuild-release@v3
        with:
          public: true
