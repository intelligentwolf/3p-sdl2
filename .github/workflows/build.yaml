name: Build
on:
  pull_request:
  push:
    branches: [main, actions, wolf]
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        # WolfViewer only takes SDL2 from this package on Linux (autobuild.xml has linux64 only).
        os: [ubuntu-22.04]
        addrsize: ["64"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Linux Build Dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        # libdecor itself is built from the libdecor submodule (build-cmd.sh) and shipped with the
        # viewer, so it needs meson, wayland-protocols and cairo/pango headers for its plugin.
        # Deliberately NOT libdecor-0-dev: SDL must configure against the bundled libdecor.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxext-dev libibus-1.0-dev \
            fcitx-libs-dev libudev-dev libunwind-dev \
            libwayland-dev libxkbcommon-dev libpulse-dev libsndio-dev \
            meson wayland-protocols libcairo2-dev libpango1.0-dev

      - name: Build with autobuild
        uses: secondlife/action-autobuild@v5
        with:
          addrsize: ${{ matrix.addrsize }}
  release:
    needs: build
    runs-on: [ubuntu-latest]
    # A new fork's token is read-only; creating the release needs write (v2.28.0-w1 failed on it).
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: secondlife/action-autobuild-release@v3
        with:
          public: true
